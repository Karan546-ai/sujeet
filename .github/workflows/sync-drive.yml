# Pulls new videos from the Google Drive portfolio folder every hour and commits them,
# which redeploys the site. Run it by hand from the Actions tab ("Run workflow") after uploading.
name: Sync Google Drive work

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: drive-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install ffmpeg (poster frames)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Sync Drive folder
        run: node scripts/sync-drive.mjs
      - name: Commit new work
        run: |
          if [ -n "$(git status --porcelain assets)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets
            git commit -m "Sync new work from Google Drive"
            git push
          else
            echo "No new work in Drive."
          fi
